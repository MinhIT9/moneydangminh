<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đăng ký</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="/static/css/app.css"></head><body class="auth-bg"><main class="auth-card"><div class="brand mb-4">M<span>₫</span> Minh Finance</div><h1>Tạo tài khoản</h1><p class="muted">Đăng ký có thể đang được quản trị viên đóng.</p><form id="reg"><label>Email</label><input class="form-control" type="email" name="email" required><label>Mật khẩu</label><input class="form-control" type="password" name="password" minlength="8" required><div id="msg" class="small my-2"></div><button class="btn btn-primary w-100">Đăng ký</button></form><a class="small d-block text-center mt-3" href="/login">Về đăng nhập</a></main><script>reg.onsubmit=async e=>{e.preventDefault();let b=e.submitter;b.disabled=true,d=Object.fromEntries(new FormData(reg)),r=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)}),j=await r.json();msg.className='small my-2 '+(j.success?'text-success':'text-danger');msg.textContent=j.success?'Đăng ký thành công. Bạn có thể đăng nhập.':j.message;b.disabled=false}</script></body></html>
