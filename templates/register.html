<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đăng ký · Minh Finance</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="/static/css/app.css"></head><body class="auth-bg"><main class="auth-card"><div class="brand mb-4">M<span>₫</span> Minh Finance</div><h1>Tạo tài khoản</h1><p class="muted">Bắt đầu ghi chép thu chi của bạn.</p><form id="reg"><label>Email</label><input class="form-control" type="email" name="email" autocomplete="email" required><label>Số điện thoại</label><input class="form-control" type="tel" name="phone" inputmode="tel" autocomplete="tel" placeholder="Ví dụ: 0901234567" pattern="0[35789][0-9]{8}" maxlength="10" required><label>Mật khẩu</label><input class="form-control" type="password" name="password" autocomplete="new-password" minlength="8" required><label>Nhập lại mật khẩu</label><input class="form-control" type="password" name="password_confirmation" autocomplete="new-password" minlength="8" required><div id="msg" class="small my-2" aria-live="polite"></div><button class="btn btn-primary w-100">Đăng ký</button></form><a class="small d-block text-center mt-3" href="/login">Về đăng nhập</a></main><script>reg.onsubmit=async e=>{e.preventDefault();let b=e.submitter,d=Object.fromEntries(new FormData(reg));if(d.password!==d.password_confirmation){msg.className='small my-2 text-danger';msg.textContent='Nhập lại mật khẩu chưa khớp.';return}b.disabled=true;try{let r=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)}),j=await r.json();msg.className='small my-2 '+(j.success?'text-success':'text-danger');msg.textContent=j.success?'Đăng ký thành công. Bạn có thể đăng nhập.':j.message}catch{msg.className='small my-2 text-danger';msg.textContent='Không thể kết nối máy chủ.'}finally{b.disabled=false}}</script></body></html>
