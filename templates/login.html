<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow,noarchive" />
    <title>Đăng nhập · Minh Finance</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/css/app.css" />
  </head>
  <body class="auth-bg">
    <main class="auth-card">
      <div class="brand mb-4">M<span>₫</span> Minh Finance</div>
      <h1>Chào mừng trở lại</h1>
      <p class="muted">Đăng nhập để quản lý tài chính của bạn.</p>
      <form id="login">
        <label>Email</label
        ><input class="form-control" type="email" name="email" required autofocus /><label
          >Mật khẩu</label
        ><input
          class="form-control"
          type="password"
          name="password"
          autocomplete="current-password"
          required
        />
        <div id="error" class="text-danger small my-2" aria-live="polite"></div>
        <button class="btn btn-primary w-100">Đăng nhập</button>
      </form>
      <a class="small d-block text-center mt-3" href="/register">Đăng ký tài khoản</a>
    </main>
    <script>
      login.onsubmit = async (e) => {
        e.preventDefault();
        let b = e.submitter;
        b.disabled = true;
        try {
          let d = Object.fromEntries(new FormData(login)),
            r = await fetch('/api/auth/login', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(d),
            }),
            j = await r.json();
          if (j.success) location = '/dashboard';
          else error.textContent = j.message;
        } catch {
          error.textContent = 'Không thể kết nối máy chủ.';
        } finally {
          b.disabled = false;
        }
      };
    </script>
  </body>
</html>
